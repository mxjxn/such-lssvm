name: test

on:
    workflow_dispatch:
    push:
        branches: [main]
        paths-ignore:
            - '**.md'
    pull_request:
        branches: [main]
        paths-ignore:
            - '**.md'

env:
    FOUNDRY_PROFILE: ci

defaults:
    run:
        working-directory: packages/lssvm-contracts

jobs:
    check:
        strategy:
            fail-fast: true

        name: Foundry Project
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive

            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'

            - name: Install eth_abi
              run: pip install eth_abi

            - name: Install Foundry
              uses: foundry-rs/foundry-toolchain@v1
              with:
                  version: nightly

            - name: Run Forge build
              run: |
                  forge --version
                  forge build --sizes
              id: build

            - name: Run Forge tests
              run: |
                  forge test \
                    --match-path 'src/test/bonding-curve-tests/*.t.sol' \
                    --no-match-path '*Huff*' \
                    --ffi -vvv
              id: test

            - name: Run Forge coverage
              run: |
                  forge coverage --report lcov \
                    --match-path 'src/test/bonding-curve-tests/*.t.sol' \
                    --no-match-path '*Huff*' \
                    --no-match-test 'testGas*' \
                    --ffi
              id: coverage

            - name: Setup LCOV
              run: echo "Installing lcov"; sudo apt-get install -y lcov > /dev/null

            - name: Clean LCOV
              run: |
                  if [ -f lcov.info ]; then
                      # lcov may exit 25 when filters match only partially; report is still usable.
                      lcov --remove lcov.info -o lcov.info 'src/mocks/*' 'src/test/*' 'src/testgen-scripts/*' 'src/lib/*' 'script/*' || true
                  else
                      echo "lcov.info not found, skipping cleanup"
                  fi

            - name: Upload coverage reports to Codecov
              if: always() && hashFiles('packages/lssvm-contracts/lcov.info') != ''
              uses: codecov/codecov-action@v3.1.1
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: packages/lssvm-contracts/lcov.info
                  fail_ci_if_error: false